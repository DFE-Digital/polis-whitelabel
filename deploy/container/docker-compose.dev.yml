
version: "3.4"

services:
  maildev:
    image: docker.io/maildev/maildev
    ports:
      # User interface
      - "1080:1080"
      # SMTP port
      - "25:25"
    networks:
      - "polis-net"
  server:
    container_name: polis-server
    env_file: ../../server/.envrc
    # The following overrides the env_file ...
    environment:
      STATIC_FILES_HOST: file-server
      STATIC_FILES_PORT: 8080
      DATABASE_URL: postgres://postgres:mypassword@postgres:5432/postgres
      DOMAIN_OVERRIDE: http://server:8000
    image: polis-server:latest
    build:
      context: ../../server
      dockerfile: ../deploy/container/server.Containerfile
    depends_on:
      - "postgres"
      - "file-server"
    ports:
      - 8000:8000
    networks:
      - "polis-net"
    # Scale the server container to a given number of instances.
    scale: 1

  math:
    container_name: polis-math
    env_file: ../../math/.envrc
    # The following overrides the env_file ...
    environment:
      DATABASE_URL: postgres://postgres:mypassword@postgres:5432/postgres
    image: polis-math:latest
    depends_on:
      - "postgres"
    build:
      context: ../../math
      dockerfile: ../deploy/container/math.Containerfile
    networks:
      - "polis-net"

  postgres:
    container_name: polis-postgres
    env_file: ../../database/.envrc
    image: polis-postgres:latest
    restart: always
    build:
      context: ../../database
      dockerfile: ../deploy/container/postgres.Containerfile
    ports:
      - 5432:5432
    networks:
      - "polis-net"
    # volumes:
    #   - "backups:/backups"
    #   - "postgres:/var/lib/postgresql/data"


  file-server:
    container_name: polis-file-server
    image: polis-file-server:latest
    build:
      context: ../../
      dockerfile: ./deploy/container/file-server.Containerfile
    ports:
      - 8080:8080
    networks:
      - "polis-net"

  reverse-proxy:
    image: polis-reverse-proxy:latest
    build:
      context: .
      dockerfile: ./reverse-proxy.Containerfile
    ports:
      - 3000:80
    environment:
      - POLIS_SERVER_HOST=http://server:8000
    depends_on:
      - "server"
    networks:
      - "polis-net"

networks:
  polis-net:

